events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # Optimization
    sendfile        on;
    keepalive_timeout  65;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # HTTP: Redirección automática y retos de Let's Encrypt
    server {
        listen 80;
        server_name alpr.optrax.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: Configuración Completa SSL con Proxy Reverso a los estáticos de la APP
    server {
        listen 443 ssl;
        server_name alpr.optrax.io;

        # Certificados SSL Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/alpr.optrax.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alpr.optrax.io/privkey.pem;

        # Parámetros SSL de seguridad recomendados
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # Raíz de los archivos estáticos construidos de la App
        root /usr/share/nginx/html;
        index index.html;

        # Configuración para archivos estáticos con hash
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback: cualquier ruta cae en index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # El index nunca se cachea para garantizar que se lean despliegues frescos
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Headers de seguridad
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
