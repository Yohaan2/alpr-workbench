services:
  alpr-workbench:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # El endpoint se inyecta en build-time. Defínelo en un .env junto al compose
        # o expórtalo en tu shell: VITE_ALPR_ENDPOINT=https://tu-servicio.com/analyze
        VITE_ALPR_ENDPOINT: ${VITE_ALPR_ENDPOINT:-https://tu-servicio.com/analyze}
    image: alpr-workbench:latest
    container_name: alpr-workbench
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
