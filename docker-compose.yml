services:
  nginx:
    image: nginx:1.27-alpine
    container_name: alpr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - app_dist:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      alpr-workbench:
        condition: service_completed_successfully

  alpr-workbench:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ALPR_ENDPOINT: ${VITE_ALPR_ENDPOINT:-https://tu-servicio.com/analyze}
    image: alpr-workbench:latest
    container_name: alpr-workbench
    # Servicio "publisher": copia los estáticos al volumen y termina.
    restart: "no"
    volumes:
      - app_dist:/shared

  certbot:
    image: certbot/certbot
    container_name: alpr-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  app_dist:
